# Throwaway LimeSurvey test rig for LOCAL development only.
#
#   docker compose -f docker-compose.limesurvey-test.yml up -d
#
#   LimeSurvey admin : http://localhost:8080/index.php/admin   (admin / see below)
#   Mailpit inbox    : http://localhost:8025
#
# Purpose: exercise the whole invitation loop — send mail, open the tokenised
# link, submit, pull the response back, score it — WITHOUT any mail leaving this
# machine. Mailpit is a catch-all SMTP sink: LimeSurvey thinks it sent the mail,
# Mailpit shows it in a web inbox, nothing reaches a real recipient.
#
# NOT for production and NOT for real patient data: the passwords are in this
# file, there is no TLS, and the database has no backup. The clinic instance is
# a separate, properly operated deployment.
#
# The app itself keeps running on the host (`npm run dev`), not in here — it
# reaches LimeSurvey at http://localhost:8080 and LimeSurvey's generated survey
# links reach the app at http://localhost:3000.
services:
  limesurvey:
    # 6-apache matches most existing clinic installs. Switch to 7-apache if the
    # clinic will run LimeSurvey 7 — RemoteControl 2 works the same on both.
    image: martialblog/limesurvey:6-apache
    depends_on:
      - lime-db
    ports:
      - "8080:8080" # Apache listens on 8080 INSIDE the container (rootless image)
    environment:
      - DB_TYPE=mysql
      - DB_HOST=lime-db
      - DB_PORT=3306
      - DB_NAME=limesurvey
      - DB_USERNAME=limesurvey
      - DB_PASSWORD=limesurvey-test-pw
      # Only applied on FIRST boot — change them later in the admin panel.
      - ADMIN_USER=admin
      - ADMIN_NAME=Administrator
      - ADMIN_EMAIL=noreply@linden-clinic.test
      - ADMIN_PASSWORD=limesurvey-admin-pw
      # So generated survey links point at the host, not the container.
      - PUBLIC_URL=http://localhost:8080
    volumes:
      # A NAMED volume (not a host bind mount): Docker seeds it from the image,
      # so the themes/plugins LimeSurvey ships with are present. A bind mount
      # would start empty and break the installation.
      - lime-upload:/var/www/html/upload

  lime-db:
    image: mariadb:11.4
    environment:
      - MARIADB_DATABASE=limesurvey
      - MARIADB_USER=limesurvey
      - MARIADB_PASSWORD=limesurvey-test-pw
      - MARIADB_ROOT_PASSWORD=limesurvey-root-pw
    volumes:
      - lime-db:/var/lib/mysql

  # Catch-all SMTP server + web inbox. LimeSurvey sends here (host "mailpit",
  # port 1025 on the compose network); you read the mail at localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP — only needed if something on the host wants to send

volumes:
  lime-upload:
  lime-db:
