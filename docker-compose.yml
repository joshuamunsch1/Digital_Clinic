# Local container run. Uses the default SQLite database persisted in a volume.
# To use Postgres instead: switch prisma/schema.prisma `provider` to "postgresql",
# uncomment the `db` service below, and point DATABASE_URL at it.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      # Set to "true" only when serving over HTTPS:
      - COOKIE_SECURE=false
      # - FHIR_RELAY_URL=https://your-fhir-server/QuestionnaireResponse
    volumes:
      - dbdata:/app/prisma
  #   depends_on:
  #     - db
  #
  # db:
  #   image: postgres:16
  #   environment:
  #     - POSTGRES_USER=linden
  #     - POSTGRES_PASSWORD=linden
  #     - POSTGRES_DB=linden
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  dbdata:
